name: lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ruff:
    name: ruff (lint + format)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install "ruff>=0.6"

      - name: ruff check
        run: ruff check . --output-format=github

      - name: ruff format --check
        run: ruff format --check .

  package:
    name: pacote instalável (console script)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build wheel e instala num venv limpo
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel --outdir dist
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install -q dist/*.whl

      - name: curso-factory roda de fora do repositório
        env:
          OPENAI_API_KEY: "test-key-for-import-only"
        run: |
          cd /tmp
          /tmp/venv/bin/curso-factory --help
          /tmp/venv/bin/python -c "import src, importlib.metadata as m; print(src.__version__, m.version('curso-factory'))"
