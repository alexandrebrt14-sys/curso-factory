# Configuração de providers LLM.
#
# Centraliza pricing, endpoint, modelo padrão e fallback para cada provider.
# Antes desta config, tudo estava hardcoded em src/llm_client.py.
#
# Mudança de modelo ou de tabela de preço = edição deste arquivo. Não
# requer alterar código Python.

providers:
  perplexity:
    endpoint: "https://api.perplexity.ai/chat/completions"
    # Catálogo do geo-orchestrator v4.6 (task_routing.research): sonar-deep-research.
    default_model: "sonar-deep-research"
    # Preço por 1K tokens (input, output) em USD
    pricing:
      input: 0.002
      output: 0.008
    # Cadeia de fallback (wave 6): pesquisa cai no Gemini, depois no Claude.
    fallback_chain: [google, anthropic]
    protocol: "openai_compat"

  openai:
    endpoint: "https://api.openai.com/v1/chat/completions"
    # Catálogo v4.6 (task_routing.writing): gpt-5.5.
    default_model: "gpt-5.5"
    pricing:
      input: 0.005
      output: 0.015
    # Cadeia de fallback (wave 6), na ordem do task_routing.writing do geo-orchestrator.
    fallback_chain: [anthropic, google, perplexity]
    protocol: "openai_compat"

  google:
    # {model} é substituído pelo nome do modelo antes da chamada
    endpoint: "https://generativelanguage.googleapis.com/v1beta/models/{model}:generateContent"
    # Catálogo v4.6 (task_routing.analysis): gemini-3.1-pro-preview. A classificação usa
    # gemini-3.7-flash (task_routing.classification), definido no agente; o preço abaixo é
    # o do pro, então o custo da classificação fica superestimado no relatório.
    default_model: "gemini-3.1-pro-preview"
    pricing:
      input: 0.002
      output: 0.012
    # Cadeia de fallback (wave 6): análise e classificação caem no Claude, depois na OpenAI.
    fallback_chain: [anthropic, openai]
    protocol: "google"

  groq:
    endpoint: "https://api.groq.com/openai/v1/chat/completions"
    # Provider fora do parque do geo-orchestrator desde 2026-07-08 (Sprint 16). Fica só
    # como fallback opcional; nenhum agente o usa como primário.
    default_model: "openai/gpt-oss-120b"
    pricing:
      input: 0.0001
      output: 0.0002
    fallback_chain: [google, anthropic, openai]
    protocol: "openai_compat"

  anthropic:
    endpoint: "https://api.anthropic.com/v1/messages"
    # Catálogo v4.6 (task_routing.review): claude-sonnet-5. Opus e Fable ficam para
    # critical_review, que este pipeline não roda.
    default_model: "claude-sonnet-5"
    pricing:
      input: 0.003
      output: 0.015
    # Cadeia de fallback (wave 6): revisão cai no Gemini, depois na OpenAI.
    fallback_chain: [google, openai]
    protocol: "anthropic"
