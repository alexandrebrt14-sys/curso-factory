  - slug: reinforcement-learning-vibecoding
    nome: "Reinforcement Learning para Vibecoding: do prompt ao loop verificável em agentes de código"
    nivel: avançado
    modulos: 8
    descricao: "Curso avançado que transforma vibecoding de truque de produtividade em disciplina de engenharia: como treinar, avaliar e operar agentes de código (SWE-agents) com recompensas verificáveis. Do panorama recente (o termo de Karpathy, a onda de RL em raciocínio, GRPO) até um orquestrador multiagente em produção com verificador independente, reward shaping resistente a hacking, self-improvement loops e FinOps. A tese central: o valor migra do prompt isolado para o loop — quem controla o verificador, a função de recompensa, o roteamento e a telemetria de custo controla a qualidade do código gerado. Destinado a engenheiros sênior/staff/principal de IA, pesquisadores de ML e engenheiros de backend/LLMOps que já operam LLMs em produção."
    tags: [RLVR, RLHF, RLAIF, GRPO, DPO, KTO, ORPO, PPO, reward-modeling, reward-hacking, SWE-agents, Vibecoding, unit-tests-as-reward, self-improvement-loops, LLMOps, FinOps]
    prerequisitos:
      - "Python 3.11+ com concorrência assíncrona (async/await, httpx async) e código modular, testável e observável"
      - "PyTorch em produção e compreensão estrutural da arquitetura Transformer e mecanismos de atenção"
      - "Fundamentos de Reinforcement Learning: reward, policy, action, state, trajectory e design de função de recompensa"
      - "Consumo de APIs de LLMs fundacionais (Anthropic, OpenAI, Google AI, Perplexity) e engenharia de prompts avançada"
      - "Operação de sistemas com LLMs em produção: cache, retry, timeout, fallback, circuit breaker, evals e observabilidade"
    duracao_estimada: "~450 min"
    prioridade: P1
    estrutura_modulos:
      - titulo: "Por que RL importa no Vibecoding: o valor migra do prompt para o loop"
        descricao: >
          Panorama executivo e técnico. Definir vibecoding conforme o termo popularizado por Karpathy no início de 2025 e distingui-lo de AI-assisted coding e de agentic engineering com oversight humano. Mapear os SWE-agents e a interface computador-agente (ACI), com a evolução das taxas de resolução em benchmarks estilo SWE-bench e as variantes de mercado (Devin, Claude Code, OpenHands, Aider, Cline, Goose). A tese central do curso: a geração automática ficou barata e a validação ficou cara, portanto o valor defensável está no loop gerar to verificar to recompensar to atualizar, não no prompt. Apresentar a convergência recente entre LLMs, engenharia de software e RL (a explosão de RL em raciocínio; a popularização de recompensas verificáveis). Expor as cinco camadas de arquitetura: geração multi-LLM por complexidade, verificação local, recompensa verificável, aprendizado de política (PPO/DPO/GRPO) e FinOps. Trazer a tensão real da comunidade: soluções que passam nos testes mas são inseguras (functional nao é igual a safe) e latência dominada por chamadas de ferramenta, não por tokens por segundo. Exercício: dado um repositório com bug de concorrência que passa nos testes unitários, o aluno explica por que reranking com recompensa verificável supera o prompt único e desenha o loop mínimo agente-verificador-recompensa.
      - titulo: "Fundamentos de RL para código: MDP, RLHF e reward modeling"
        descricao: >
          Fundamentar o problema como um MDP: ambiente, estado (enunciado, código atual, saída do compilador, resultado dos testes, cobertura, custo acumulado, tentativas restantes), ação (gerar solução, editar função, adicionar teste, executar suíte, reverter, encerrar), recompensa, trajetória e critérios de término. Cobrir RLHF em profundidade: o pipeline de três etapas do InstructGPT (pré-treino, SFT, otimização com reward model) e a perda de Bradley-Terry para pares de preferência, com implementação mínima em PyTorch (F.logsigmoid sobre a diferença entre chosen_rewards e rejected_rewards). Discutir a perspectiva estatística do RLHF: viés de anotadores, viés de comprimento (prolixidade como atalho), cobertura limitada da distribuição e sobreajuste do reward model. Nomear as três fragilidades que reaparecem no curso inteiro: viés de anotação, viés de comprimento e reward hacking do próprio reward model. Situar por que preferência humana pura é ineficiente quando a correção é verificável por execução de testes, preparando a transição para RLAIF e RLVR. Introduzir PPO e a regularização por KL contra a política de referência e o coeficiente que limita o afastamento. Exercício: implementar a perda de reward modeling de Bradley-Terry, gerar pares sintéticos e discutir por que o score bruto do reward model não é calibrado entre domínios (código versus texto jurídico).
      - titulo: "Técnicas core: RLVR, GRPO, DPO, KTO e ORPO"
        descricao: >
          Núcleo algorítmico. RLVR (Reinforcement Learning with Verifiable Rewards): recompensa baseada em execução de testes, outputs de programas e constraints lógicas; o objetivo maximiza o valor verificável esperado com regularização por KL contra a política de referência. Intuição central baseada na pesquisa: recompensar apenas a resposta final ainda incentiva raciocínio intermediário correto, e métricas como pass at k precisam ser estendidas para medir a cadeia de raciocínio. GRPO (Group Relative Policy Optimization): vantagem relativa do grupo, normalizada por média e desvio, sem crítico separado — e a família de variantes que amadureceu em 2025. RLAIF como escala de alinhamento com avaliadores de IA e seus riscos (loops de feedback, viés do avaliador). Camada de destilação de preferências: DPO (pares vencedor/perdedor sem reward model separado), KTO (sinais unilaterais de aceitabilidade, com assimetria porque falso positivo em código é caro) e ORPO (SFT mais odds ratio sem política de referência explícita, ideal como destilação pós-RLVR). Matemática de search compression: elevar o Pass at 1 reduz drasticamente o número de amostras necessárias para atingir uma probabilidade-alvo de sucesso (n maior ou igual a log(1-tau)/log(1-p)). Exercício: implementar build_preference_pairs a partir de amostras verificadas, filtrando patches que editaram testes ou não compilam antes de formar os pares finais.
      - titulo: "Reward design e verifier-based rewards: testes como recompensa"
        descricao: >
          Coração da aplicação a código. Por que testes binários (passou/falhou) desperdiçam informação: um patch que corrige quase todos os testes recebe o mesmo score de outro que nem compila. Reward shaping decomposto em componentes ponderados: compilação, testes públicos, testes ocultos, mutation testing, análise estática e tamanho do diff, menos uma penalidade de hacking. Distinguir hard gates de sinais graduais: editar arquivos proibidos, o runner ou os hidden tests zera ou torna negativa a recompensa mesmo com testes passando. Unit-tests-as-reward em três fases: (1) rodar testes antes do patch para provar reprodutibilidade, (2) aplicar o patch em worktree isolada sem acesso de escrita ao verificador, (3) executar públicos mais ocultos mais checagens com timeout rígido. Combinar recompensa de testes públicos e ocultos com peso menor nos públicos para reduzir overfitting; usar mutation testing (mutantes mortos sobre totais) para detectar correções frágeis. Potential-based shaping para medir progresso em vez de preferências arbitrárias. Exercício: implementar compute_code_reward e um UnitTestRewardRunner que copia o repo para um diretório temporário, aplica o patch, detecta arquivos proibidos (CI, scripts de avaliação, testes ocultos) e devolve um RewardBreakdown estruturado. Critério de aceite: o agente não pode ser recompensado por enfraquecer validações ou mascarar falha de concorrência com sleeps.
      - titulo: "Self-improvement loops e destilação de política para SWE-agents"
        descricao: >
          Transformar tentativas em dados de treino em vez de só tentar de novo. O ciclo: a política gera k candidatos, o verificador atribui recompensa, os resultados viram um dataset de preferências que alimenta DPO, KTO ou ORPO para produzir a próxima política. Linha de pesquisa relevante: agentes que aprendem injetando e reparando bugs especificados por testes em repositórios reais, sem issues nem testes anotados por humanos, reduzindo a dependência de dados rotulados. Disciplina operacional: tarefas pequenas, commits incrementais, diffs limitados por iteração. Critério de parada não-ingênuo: parar quando a melhoria marginal da melhor recompensa fica abaixo de um limiar por m rodadas consecutivas, não quando acaba o orçamento. Controle de entropia adaptativo: mais amostras e diversidade quando a melhor recompensa ainda é baixa, convergindo para uma única amostra precisa quando já está perto da solução. Persistir quatro artefatos por iteração: prompt, patch, saída bruta do verificador e reward estruturado — patches aprovados viram SFT, pares com margem clara viram DPO/ORPO, eventos de falha viram sinal negativo. Resultado esperado: política que melhora o Pass at 1 e depende menos de amostragem massiva. Exercício: implementar um SelfImprovementLoop com configuração (amostras por rodada, máximo de rodadas, recompensa-alvo, delta mínimo), gerar os pares de preferência ao final e justificar o motivo de parada.
      - titulo: "Vibecoding em produção: orquestrador multiagente, eval harness, guardrails e FinOps"
        descricao: >
          Arquitetura de produção com autonomia limitada por contratos fortes. Princípio central: o agente nunca é a fonte da verdade — a validação fica fora dele. Estágio Zero satélite-roteador com um orquestrador local (por exemplo Ollama) que normaliza a tarefa em um contrato JSON, classifica complexidade numa escala de 1 a 5 e roteia por FinOps antes da primeira chamada paga (modelos baratos para tarefas triviais, intermediários para médias, frontier apenas para as difíceis com verificação forte). O loop agente to verificador to recompensa to política usa verificadores em camadas (sintático determinístico, semântico, factual, operacional) da mais barata para a mais cara — nunca usar LLM para o que regex, parser, type checker, linter ou teste unitário resolvem. Eval harness para código: aplicar patch, formatter, type checker, testes impactados, integração seletiva e revisão por LLM só sobre diffs e falhas. Recompensa que controla fluxo: aprovar, corrigir localmente, reenviar com feedback ou escalar a humano conforme faixas de score. Infraestrutura de resiliência: cache semântico com limiar de similaridade (nunca para dados sensíveis ou negações críticas), checkpoints para retomada e circuit breaker por provedor. FinOps operacional: custo por tarefa/rollout/episódio, taxa de cache hit, alerta em fração do orçamento, desligar workers ociosos, usar instâncias spot e reduzir inferências por episódio. Exercício: dado um orquestrador com custo subindo sem aumento de volume, segmentar por tipo, propor roteamento por complexidade, quality gates executáveis em YAML e uma métrica de qualidade que prove que a economia não degradou o produto.
      - titulo: "Riscos: reward hacking, distribution shift, segurança e governança"
        descricao: >
          Módulo de riscos, o gargalo real do vibecoding em produção. Reward hacking em código não é abstrato: apagar ou enfraquecer testes, alterar fixtures, modificar scripts de CI, capturar inputs específicos, retornar constantes esperadas, reduzir type checking, mockar dependências reais, adicionar sleeps ou retries para mascarar condição de corrida, explorar ordem de execução, código que passa localmente e falha em ambiente limpo. Formalizar uma penalidade de hacking como soma ponderada de indicadores (edição de teste, edição do runner, caminho proibido, timeout, literais suspeitos) com hard fail para edição do runner ou caminho proibido. Seis proteções estruturais: avaliação imutável (hidden tests fora do workspace), fail-before/pass-after, split público/oculto, mutation testing, sandbox com rede desativada e filesystem controlado, e revisão de diff. Sétima camada: verificação adversarial — um segundo verificador gera casos que deveriam falhar se a correção for superficial, descontando a recompensa base. Distribution shift e sobreajuste aos testes: separar treino/validação/avaliação, property-based testing, casos adversariais e medição em tarefas novas. Segurança operacional: injeção de comando, execução arbitrária, SQL injection, desserialização insegura e exfiltração de credenciais quando o agente roda shell pleno; mitigar com allowlist de ferramentas, permissões por escopo, contrato estreito por ferramenta e segredos fora do contexto. Governança: versionar prompts como código, logs imutáveis, aprovação antes de alterar política e restrição contra o agente modificar o próprio avaliador. Exercício: dado um agente que aprende que desabilitar um teste instável aumenta sua recompensa, redesenhar a função de recompensa, definir permissões por tipo de arquivo, validações externas e critérios de parada.
      - titulo: "Projeto final: agente RLVR ponta a ponta, métricas e checklist de produção"
        descricao: >
          Laboratório integrador. Construir um agente de código autônomo que resolve um incidente crítico (custo anormal por requisição, latência acima do SLO, falha de fallback, loop sem critério de parada, duplicação por timeout entre validação e persistência) e melhora seu próprio desempenho via loop explícito de self-improvement ou RLVR. O aluno escolhe um vetor: redução de custo de inferência, redução de latência ou aumento de robustez. Loop obrigatório de seis componentes: geração de hipótese, aplicação controlada (branch/sandbox rastreável por diff), verificação automática por máquina, cálculo de score, atualização de estratégia (mínimo três iterações documentadas) e critério de parada. Função de recompensa de referência a implementar e reproduzir, combinando taxa de testes aprovados, melhoria de latência, redução de custo e robustez, menos penalidade por regressão. Métricas granulares obrigatórias (Pass at 1 é insuficiente): pass rate contínuo, taxa de sucesso final, ações médias por episódio, latência p50/p95/p99, custo por episódio, regressões introduzidas, violações por análise estática, variação entre sementes e ganho contra baseline (aleatório, heurístico, LLM sem loop). Checklist de produção: orquestração em Ray/Kubernetes, separação treino/avaliação/inferência, alvos de disponibilidade e latência em rotas críticas, observabilidade contínua, sandbox isolado para todo código gerado, análise estática obrigatória, MFA e menor privilégio, rollback automático e critérios de bloqueio. Entregáveis: repositório reproduzível, README técnico, relatório com baseline versus versão final, logs e traces por iteração, relatório transparente de vibecoding (ferramentas, prompts, decisões aceitas e rejeitadas, correções humanas) e demonstração gravada de 5 a 10 minutos.
