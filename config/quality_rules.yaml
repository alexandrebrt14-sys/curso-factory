# curso-factory — Regras de Qualidade
# Validação automática de 5 camadas antes do deploy
#
# LIDO EM RUNTIME desde 11/08/2026 por src/validators/rules_loader.py.
# Até essa data o arquivo era decorativo: nenhum código o abria, e as listas
# aqui divergiam em silêncio das constantes hardcoded nos validadores.
# Agora mudar uma lista aqui MUDA O COMPORTAMENTO DO GATE — acrescentar uma
# expressão em forbidden_expressions passa a reprovar conteúdo no próximo run.
# Chaves consumidas hoje:
#   validation.forbidden_expressions.expressions  -> _check_cliches
#   validation.anti_invencao.require_source_for_percentages
#   validation.anti_invencao.fail_if_unresolved_markers_above
#   validation.visual_density.*                  -> check_visual_density
# As demais seções seguem descritivas; o valor espelhado em código está
# anotado por comentário na chave correspondente.

validation:
  # Camada 1: Acentuação PT-BR
  accent_check:
    enabled: true
    language: pt-BR
    fail_on_missing: true
    auto_fix: true  # Corrige automaticamente antes de validar
    dictionary_size: 300  # 300+ mapeamentos
    known_exceptions:
      - URLs
      - slugs
      - imports
      - código inline
      - blocos de código (```)
      - nomes de variáveis
      - JSX/HTML attributes
      - caminhos de arquivo
      - Markdown links

  # Camada 2: Qualidade de conteúdo
  #
  # A UNIDADE DE MEDIDA É A AULA desde 27/08/2026. Antes era o módulo, com
  # 2.500-4.000 palavras, e o resultado eram cursos rasos: o gerador enchia a
  # cota com abrangência em vez de explicar uma ideia por inteiro. A régua nova
  # vem do tipo D ("aula/trilha") da tabela única de tetos da fonte de estilo
  # (alexandrebrt14-sys/escrita-empreendedor, MOLDES_DE_PAGINA.md seções 2, 3-D
  # e 6).
  #
  # OS NÚMEROS DE EXTENSÃO DA AULA NÃO ESTÃO AQUI. Eles vêm de
  # config/lexicos.json (espelho gerado da fonte, bloco `tetos.D`), lido em
  # runtime por src/validators/lexicos_loader.py. Repetir o número aqui criaria
  # a segunda cópia que o PLANO_DE_MIGRACAO.md proíbe. Para referência humana,
  # hoje `tetos.D` diz: piso 900 · alvo 1.200-2.400 · aviso 2.400 · erro 3.600
  # palavras; 2 a 4 H2; até 2 H3 por H2; até 3 figuras; parágrafo 15-45
  # palavras. Se este comentário divergir do JSON, o JSON vence.
  #
  # As chaves abaixo são o que é específico do curso-factory e não existe na
  # fonte. Cada uma é lida em runtime por content_checker.py.
  content_quality:
    enabled: true
    # Trilha = 4 a 6 aulas (MOLDES_DE_PAGINA.md seção 6), 30-60 min.
    min_lessons_per_trail: 4
    max_lessons_per_trail: 6
    min_trails_per_course: 5
    max_trails_per_course: 8
    # Compatibilidade com o pipeline atual, que ainda entrega "módulo": um
    # módulo equivale a uma trilha, ou seja, 4 a 6 aulas. O checador multiplica
    # os tetos da aula por essa faixa quando recebe unidade="modulo", de modo
    # que 4x1.200 a 6x2.400 = 4.800-14.400 palavras. Ver o docstring de
    # content_checker.check_content.
    lessons_per_module: [4, 6]
    # Um exercício por aula ("faça agora", 5-15 min). Era "mínimo 3 por
    # módulo", que produzia bateria de exercício sem conceito explicado.
    min_exercises_per_lesson: 1
    # Uma fonte datada por trilha, no rodapé, e uma cápsula por trilha.
    min_sources_per_trail: 1
    min_capsules_per_trail: 1
    # Tabela, figura, blockquote e negrito não têm piso desde 02/09/2026:
    # cobrar "3 termos em negrito" produzia destaque por cota, e destaque em
    # excesso anula o destaque. A chave abaixo só age se for maior que zero.
    min_bold_terms_per_lesson: 0
    max_reading_time_per_lesson_minutes: 15

  # Camada 2b: Densidade visual (DIRETRIZ_EDITORIAL.md §11.1 e
  # docs/DOUTRINA_VISUAL_CURSOS.md). Instalada em 17/08/2026, depois de o curso
  # motor-de-crescimento-ia ir ao ar com 114 blocos de prosa acima de 1.200
  # caracteres e nenhuma figura, aprovado por todos os portões da casa porque
  # nenhum deles mede peso de bloco.
  #
  # LIDA EM RUNTIME desde 17/08/2026 por
  # src/validators/visual_density.py::check_visual_density, que mede a lista de
  # CourseSection de cada módulo. Até essa data a seção era declarativa e quem
  # cobrava era só o portão da landing (node scripts/gate-peso-visual.mjs <slug>).
  # Mudar qualquer número aqui MUDA O VEREDITO no próximo run: nenhum dos três
  # limites existe como constante em código, e tests/test_visual_density.py
  # prova isso trocando a configuração e conferindo que o resultado acompanha.
  # Chaves consumidas: enabled, required_for_new_course, max_paragraph_chars,
  # min_visual_blocks_per_module, chars_per_visual_block, visual_block_types e
  # non_visual_types. Seção ausente ou enabled: false não derruba o pipeline:
  # o checador devolve um aviso dizendo que a densidade não foi cobrada.
  visual_density:
    enabled: true
    # Obrigatória e integral para curso novo. Para o acervo já publicado a régua
    # entra por linha de base congelada: a dívida registrada só pode diminuir.
    # Em código: check_visual_density(..., curso_novo=False) rebaixa todo achado
    # a aviso, então o legado aparece contado no relatório sem bloquear.
    required_for_new_course: true
    # Teto do PARÁGRAFO, não do bloco: um bloco de prosa com três parágrafos
    # separados por linha em branco responde por cada um deles isoladamente.
    # 1.200 é o que cabe num celular de 390 pontos sem rolagem interna.
    max_paragraph_chars: 1200
    # ATENÇÃO À UNIDADE: este piso é POR MÓDULO, e módulo equivale a 4-6
    # aulas. O teto editorial é por AULA e vale 3 (tetos.D.figuras_max em
    # config/lexicos.json), então um módulo cheio pode ter até 18 peças. Os
    # dois convivem: 3 é o mínimo para o módulo inteiro não nascer paredão,
    # 3 por aula é o máximo para a peça não virar enfeite. Desde 27/08/2026 a
    # obrigação editorial é o TETO; este piso permanece só como rede do motor
    # de renderização da landing.
    min_visual_blocks_per_module: 3
    # O piso acima só vale para módulo que é capítulo de verdade. Abaixo deste
    # tanto de prosa o módulo é abertura, encerramento ou trecho de apoio, e
    # cobrar três peças ali produz enfeite, não leitura. A densidade continua
    # valendo em qualquer tamanho, e é ela que pega o módulo longo. O portão
    # gate-peso-visual.mjs do landing-page-geo usa o mesmo corte.
    min_prose_chars_for_floor: 800
    # Um bloco visual a cada 2.500 caracteres de prosa do módulo. Módulo curto
    # com 3 figuras passa; módulo de 20 mil caracteres com 3 figuras não.
    chars_per_visual_block: 2500
    # Tipos que CONTAM como bloco visual. O checador usa a UNIÃO desta lista com
    # VISUAL_SECTION_TYPES de src/models.py, que é o que o gerador sabe emitir
    # hoje (figure, dataTable, comparison, statGrid, stepGuide, timeline). Os
    # demais nomes abaixo só o motor da landing desenha; ficam listados para dar
    # crédito a curso montado lá. Ilustração e diagrama quebram parede
    # de verdade; estrutura organiza o que já era comparável ou sequencial;
    # o terceiro grupo divide conteúdo longo sem perder profundidade.
    visual_block_types:
      - figure
      - dataTable
      - comparison
      - matrix
      - statGrid
      - timeline
      - flow
      - checklist
      - glossary
      - accordion
      - template
      - useCase
      - tabs
      - slides
      - tipCard
      - stepGuide
      - codeDownload
    # Aparato, não respiro: NÃO contam como bloco visual e também ficam fora do
    # denominador de prosa da regra de densidade. sourceNote é registro
    # de procedência em corpo reduzido e não conta nem como paredão nem como
    # alívio; quem mede pelo DOM filtra pela cadeia de ancestrais.
    non_visual_types:
      - code
      - prompt
      - sourceNote

  # Padrão editorial. A régua de prosa da AULA é a de linguagem simples da
  # fonte de estilo (escrita-empreendedor: leitor leigo, celular). HBR, MIT
  # Sloan e HSM seguem como referência de rigor de evidência e de estrutura
  # "resposta primeiro", não de registro.
  editorial_style:
    reference_publications:
      - "escrita-empreendedor (linguagem simples, jornalismo de serviço)"
      - "Harvard Business Review"
      - "MIT Sloan Management Review"
      - "HSM Management"
    tone: "analitico_propositivo"
    # Sem piso de tabela desde 02/09/2026: tabela entra quando substitui
    # texto (comparação com critérios), nunca por cota.
    require_tables_per_module: 0
    require_bloom_verbs_in_objectives: true
    bloom_accepted_levels: [3, 4, 5, 6]  # Aplicar, Analisar, Avaliar, Criar
    bloom_forbidden_verbs:
      - "entender"
      - "conhecer"
      - "saber"
      - "compreender"
      - "lembrar"
      - "memorizar"
      - "listar"
      - "descrever"
      - "identificar"
      - "reconhecer"
      - "definir"
    bloom_accepted_verbs:
      - "analisar"
      - "comparar"
      - "diferenciar"
      - "diagnosticar"
      - "categorizar"
      - "avaliar"
      - "justificar"
      - "priorizar"
      - "recomendar"
      - "defender"
      - "criar"
      - "projetar"
      - "formular"
      - "propor"
      - "desenvolver"
      - "aplicar"
      - "implementar"
      - "executar"
      - "demonstrar"
      - "calcular"

  # Andragogia (Malcolm Knowles)
  andragogy:
    enabled: true
    principles_required:
      - necessidade_de_saber
      - autoconceito
      - experiencia_previa
      - prontidao
      - orientacao_a_problemas
      - motivacao_intrinseca
    min_principles_present: 4  # Mínimo 4 de 6 para aprovação
    # Desde 02/09/2026 a andragogia só avisa: os marcadores são lexicais e
    # reprovavam aula que aplicava Knowles com outras palavras.
    fail_if_missing: 0

  # Clichês e expressões proibidas — SÓ O QUE A FONTE NÃO COBRE.
  # A lista viva tem três origens, unidas em runtime por
  # content_checker._forbidden_expressions(): (1) config/lexicos.json, o
  # espelho gerado da fonte de estilo (clichê de máquina, adjetivo vazio,
  # atribuição vaga, escassez fabricada, conectivo de enchimento);
  # (2) a lista abaixo, com o que é específico do curso-factory; (3) o
  # fallback residual do módulo. Em 27/08/2026 saíram daqui as 21 entradas
  # que a fonte já trazia ("nos dias de hoje", "especialistas apontam",
  # "clique aqui"...): elas continuam sendo checadas, agora pela fonte.
  # Duas cópias da mesma lista divergem em silêncio, que foi o defeito de
  # 11/08/2026. Não acrescente aqui expressão que já esteja em lexicos.json.
  forbidden_expressions:
    enabled: true
    fail_on_found: true
    expressions:
      - "é fundamental que"
      - "não é segredo que"
      - "o futuro é agora"
      - "vamos explorar"
      - "como sabemos"
      - "diante desse cenário"
      - "vale a pena destacar"
      - "grosso modo"
      - "vamos aprender"
      - "agora você vai entender"
      - "como todos sabem"
      - "desde os primórdios"
      - "desde tempos imemoriais"
      - "marco importante"
      - "papel crucial"
      - "momento decisivo"
      - "no cenário atual"
      - "em um contexto em constante evolução"
      - "solução inovadora"
      - "experiência fluida"
      - "abordagem poderosa"
      - "ambiente dinâmico"
      - "análises sugerem"
      - "é importante observar"
      - "não se trata apenas de"
      - "a verdadeira questão é"
      - "no fim, tudo se resume a"
      - "o futuro é promissor"
      - "abre caminho para novas possibilidades"
      - "representa um passo importante"
      - "atua como"
      - "se posiciona como"
      - "cumpre o papel de"
      - "descubra o poder"
      - "saiba mais"

  # Anti-invenção (Humanizador 2.6.2) — humanizar não é inventar
  anti_invencao:
    enabled: true
    allow_marker: "[FALTA EVIDÊNCIA:"  # Redator pode marcar lacunas para o revisor
    # LIDO EM RUNTIME — content_checker.py::check_content (erro bloqueante).
    # Também conta "[PREENCHER-HUMANO:". Default no código: 5.
    fail_if_unresolved_markers_above: 5  # Mais que 5 marcadores sobrando = reprovar
    ban_vague_attribution: true  # "especialistas apontam" sem citação = erro
    # LIDO EM RUNTIME — content_checker.py::_check_percentages_have_source
    # (aviso não-bloqueante, teto de 5 por documento). Default no código: true.
    require_source_for_percentages: true  # Todo "%" deve ter fonte próxima

  # Camada 3: Links
  link_check:
    enabled: true
    check_internal: true
    check_external: false
    fail_on_broken: true
    url_must_not_contain_accents: true  # Crítico — incidente 2026-03-27

  # Camada 4: HTML
  html_validation:
    enabled: true
    check_closing_tags: true
    check_valid_attributes: true
    check_accessibility: true
    required_elements:
      - meta[charset]
      - title
      - main
      - h1

  # Camada 5: FinOps
  finops:
    budget_guard_enabled: true
    alert_at_percent: 80
    block_at_percent: 100
    cost_report_after_each_course: true
    max_claude_per_course_usd: 5.00
    max_total_per_course_usd: 10.00

  # Proibições globais
  global_prohibitions:
    emojis: true
    superlativos_sem_evidencia: true
    credenciais_inventadas: true

  # Anti-retrabalho
  anti_retrabalho:
    atomic_generation: true
    no_heredocs_over_50_lines: true
    no_regex_substitution: true
    validate_before_deploy: true
    cache_approved_content: true
    prompts_in_external_files: true  # src/templates/prompts/*.md
