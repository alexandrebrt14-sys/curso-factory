# curso-factory — Regras de Qualidade
# Validação automática de 5 camadas antes do deploy
#
# LIDO EM RUNTIME desde 11/08/2026 por src/validators/rules_loader.py.
# Até essa data o arquivo era decorativo: nenhum código o abria, e as listas
# aqui divergiam em silêncio das constantes hardcoded nos validadores.
# Agora mudar uma lista aqui MUDA O COMPORTAMENTO DO GATE — acrescentar uma
# expressão em forbidden_expressions passa a reprovar conteúdo no próximo run.
# Chaves consumidas hoje:
#   validation.forbidden_expressions.expressions  -> _check_cliches
#   validation.anti_invencao.require_source_for_percentages
#   validation.anti_invencao.fail_if_unresolved_markers_above
#   validation.visual_density.*                  -> check_visual_density
#   validation.abertura.*                        -> abertura_checker
#   validation.didatica.*                        -> didatica_checker
#   validation.palavras_de_uso_exagerado.*       -> vocabulario_checker
# As demais seções seguem descritivas; o valor espelhado em código está
# anotado por comentário na chave correspondente.

validation:
  # Camada 1: Acentuação PT-BR
  accent_check:
    enabled: true
    language: pt-BR
    fail_on_missing: true
    auto_fix: true  # Corrige automaticamente antes de validar
    dictionary_size: 300  # 300+ mapeamentos
    known_exceptions:
      - URLs
      - slugs
      - imports
      - código inline
      - blocos de código (```)
      - nomes de variáveis
      - JSX/HTML attributes
      - caminhos de arquivo
      - Markdown links

  # Camada 2: Qualidade de conteúdo
  #
  # A UNIDADE DE MEDIDA É A AULA desde 27/08/2026. Antes era o módulo, com
  # 2.500-4.000 palavras, e o resultado eram cursos rasos: o gerador enchia a
  # cota com abrangência em vez de explicar uma ideia por inteiro. A régua nova
  # vem do tipo D ("aula/trilha") da tabela única de tetos da fonte de estilo
  # (alexandrebrt14-sys/escrita-empreendedor, MOLDES_DE_PAGINA.md seções 2, 3-D
  # e 6).
  #
  # OS NÚMEROS DE EXTENSÃO DA AULA NÃO ESTÃO AQUI. Eles vêm de
  # config/lexicos.json (espelho gerado da fonte, bloco `tetos.D`), lido em
  # runtime por src/validators/lexicos_loader.py. Repetir o número aqui criaria
  # a segunda cópia que o PLANO_DE_MIGRACAO.md proíbe. Para referência humana,
  # hoje `tetos.D` (fonte 1.7.1) diz: piso 700 · alvo 900-1.800 · aviso 2.400 ·
  # erro 3.600 palavras; 2 a 4 H2; 1 H3 por H2; até 3 figuras; parágrafo 20-80
  # palavras. Se este comentário divergir do JSON, o JSON vence. Piso e faixa
  # de parágrafo são AVISO, nunca erro (fonte §1: piso rígido é motor de
  # enchimento).
  #
  # As chaves abaixo são o que é específico do curso-factory e não existe na
  # fonte. Cada uma é lida em runtime por content_checker.py.
  content_quality:
    enabled: true
    # Trilha = 4 a 6 aulas (MOLDES_DE_PAGINA.md seção 6), 30-60 min.
    min_lessons_per_trail: 4
    max_lessons_per_trail: 6
    min_trails_per_course: 5
    max_trails_per_course: 8
    # Compatibilidade com o pipeline atual, que ainda entrega "módulo": um
    # módulo equivale a uma trilha, ou seja, 4 a 6 aulas. O checador multiplica
    # os tetos da aula por essa faixa quando recebe unidade="modulo", de modo
    # que 4x1.200 a 6x2.400 = 4.800-14.400 palavras. Ver o docstring de
    # content_checker.check_content.
    lessons_per_module: [4, 6]
    # ZERO desde 08/09/2026 (regra R6 do mandato de abertura direta): a aula é
    # leitura, não workbook. Era 1 ("faça agora", 5-15 min) e antes "mínimo 3
    # por módulo". A presença do bloco reprova (validation.abertura); esta
    # chave só existe para cliente que precise reativar a cobrança por contrato.
    min_exercises_per_lesson: 0
    # Uma fonte datada por trilha, no rodapé, e uma cápsula por trilha.
    min_sources_per_trail: 1
    min_capsules_per_trail: 1
    # Tabela, figura, blockquote e negrito não têm piso desde 02/09/2026:
    # cobrar "3 termos em negrito" produzia destaque por cota, e destaque em
    # excesso anula o destaque. A chave abaixo só age se for maior que zero.
    min_bold_terms_per_lesson: 0
    max_reading_time_per_lesson_minutes: 15

  # Camada 2b: Densidade visual (DIRETRIZ_EDITORIAL.md §11.1 e
  # docs/DOUTRINA_VISUAL_CURSOS.md). Instalada em 17/08/2026, depois de o curso
  # motor-de-crescimento-ia ir ao ar com 114 blocos de prosa acima de 1.200
  # caracteres e nenhuma figura, aprovado por todos os portões da casa porque
  # nenhum deles mede peso de bloco.
  #
  # LIDA EM RUNTIME desde 17/08/2026 por
  # src/validators/visual_density.py::check_visual_density, que mede a lista de
  # CourseSection de cada módulo. Até essa data a seção era declarativa e quem
  # cobrava era só o portão da landing (node scripts/gate-peso-visual.mjs <slug>).
  # Mudar qualquer número aqui MUDA O VEREDITO no próximo run: nenhum dos três
  # limites existe como constante em código, e tests/test_visual_density.py
  # prova isso trocando a configuração e conferindo que o resultado acompanha.
  # Chaves consumidas: enabled, required_for_new_course, max_paragraph_chars,
  # min_visual_blocks_per_module, chars_per_visual_block, visual_block_types e
  # non_visual_types. Seção ausente ou enabled: false não derruba o pipeline:
  # o checador devolve um aviso dizendo que a densidade não foi cobrada.
  visual_density:
    enabled: true
    # Obrigatória e integral para curso novo. Para o acervo já publicado a régua
    # entra por linha de base congelada: a dívida registrada só pode diminuir.
    # Em código: check_visual_density(..., curso_novo=False) rebaixa todo achado
    # a aviso, então o legado aparece contado no relatório sem bloquear.
    required_for_new_course: true
    # Teto do PARÁGRAFO, não do bloco: um bloco de prosa com três parágrafos
    # separados por linha em branco responde por cada um deles isoladamente.
    # 1.200 é o que cabe num celular de 390 pontos sem rolagem interna.
    max_paragraph_chars: 1200
    # ATENÇÃO À UNIDADE: este piso é POR MÓDULO, e módulo equivale a 4-6
    # aulas. O teto editorial é por AULA e vale 3 (tetos.D.figuras_max em
    # config/lexicos.json), então um módulo cheio pode ter até 18 peças. Os
    # dois convivem: 3 é o mínimo para o módulo inteiro não nascer paredão,
    # 3 por aula é o máximo para a peça não virar enfeite. Desde 27/08/2026 a
    # obrigação editorial é o TETO; este piso permanece só como rede do motor
    # de renderização da landing.
    min_visual_blocks_per_module: 3
    # O piso acima só vale para módulo que é capítulo de verdade. Abaixo deste
    # tanto de prosa o módulo é abertura, encerramento ou trecho de apoio, e
    # cobrar três peças ali produz enfeite, não leitura. A densidade continua
    # valendo em qualquer tamanho, e é ela que pega o módulo longo. O portão
    # gate-peso-visual.mjs do landing-page-geo usa o mesmo corte.
    min_prose_chars_for_floor: 800
    # Um bloco visual a cada 2.500 caracteres de prosa do módulo. Módulo curto
    # com 3 figuras passa; módulo de 20 mil caracteres com 3 figuras não.
    chars_per_visual_block: 2500
    # Tipos que CONTAM como bloco visual. O checador usa a UNIÃO desta lista com
    # VISUAL_SECTION_TYPES de src/models.py, que é o que o gerador sabe emitir
    # hoje (figure, dataTable, comparison, statGrid, stepGuide, timeline). Os
    # demais nomes abaixo só o motor da landing desenha; ficam listados para dar
    # crédito a curso montado lá. Ilustração e diagrama quebram parede
    # de verdade; estrutura organiza o que já era comparável ou sequencial;
    # o terceiro grupo divide conteúdo longo sem perder profundidade.
    visual_block_types:
      - figure
      - dataTable
      - comparison
      - matrix
      - statGrid
      - timeline
      - flow
      - checklist
      - glossary
      - accordion
      - template
      - useCase
      - tabs
      - slides
      - tipCard
      - stepGuide
      - codeDownload
    # Aparato, não respiro: NÃO contam como bloco visual e também ficam fora do
    # denominador de prosa da regra de densidade. sourceNote é registro
    # de procedência em corpo reduzido e não conta nem como paredão nem como
    # alívio; quem mede pelo DOM filtra pela cadeia de ancestrais.
    non_visual_types:
      - code
      - prompt
      - sourceNote

  # Padrão editorial. A régua de prosa da AULA é a de linguagem simples da
  # fonte de estilo (escrita-empreendedor: leitor leigo, celular). HBR, MIT
  # Sloan e HSM seguem como referência de rigor de evidência e de estrutura
  # "resposta primeiro", não de registro.
  editorial_style:
    reference_publications:
      - "escrita-empreendedor (linguagem simples, jornalismo de serviço)"
      - "Harvard Business Review"
      - "MIT Sloan Management Review"
      - "HSM Management"
    tone: "analitico_propositivo"
    # Sem piso de tabela desde 02/09/2026: tabela entra quando substitui
    # texto (comparação com critérios), nunca por cota.
    require_tables_per_module: 0
    require_bloom_verbs_in_objectives: true
    bloom_accepted_levels: [3, 4, 5, 6]  # Aplicar, Analisar, Avaliar, Criar
    bloom_forbidden_verbs:
      - "entender"
      - "conhecer"
      - "saber"
      - "compreender"
      - "lembrar"
      - "memorizar"
      - "listar"
      - "descrever"
      - "identificar"
      - "reconhecer"
      - "definir"
    bloom_accepted_verbs:
      - "analisar"
      - "comparar"
      - "diferenciar"
      - "diagnosticar"
      - "categorizar"
      - "avaliar"
      - "justificar"
      - "priorizar"
      - "recomendar"
      - "defender"
      - "criar"
      - "projetar"
      - "formular"
      - "propor"
      - "desenvolver"
      - "aplicar"
      - "implementar"
      - "executar"
      - "demonstrar"
      - "calcular"

  # Andragogia (Malcolm Knowles)
  andragogy:
    enabled: true
    principles_required:
      - necessidade_de_saber
      - autoconceito
      - experiencia_previa
      - prontidao
      - orientacao_a_problemas
      - motivacao_intrinseca
    min_principles_present: 4  # Mínimo 4 de 6 para aprovação
    # Desde 02/09/2026 a andragogia só avisa: os marcadores são lexicais e
    # reprovavam aula que aplicava Knowles com outras palavras.
    fail_if_missing: 0

  # Clichês e expressões proibidas — SÓ O QUE A FONTE NÃO COBRE.
  # A lista viva tem três origens, unidas em runtime por
  # content_checker._forbidden_expressions(): (1) config/lexicos.json, o
  # espelho gerado da fonte de estilo (clichê de máquina, adjetivo vazio,
  # atribuição vaga, escassez fabricada, conectivo de enchimento);
  # (2) a lista abaixo, com o que é específico do curso-factory; (3) o
  # fallback residual do módulo. Em 27/08/2026 saíram daqui as 21 entradas
  # que a fonte já trazia ("nos dias de hoje", "especialistas apontam",
  # "clique aqui"...): elas continuam sendo checadas, agora pela fonte.
  # Duas cópias da mesma lista divergem em silêncio, que foi o defeito de
  # 11/08/2026. Não acrescente aqui expressão que já esteja em lexicos.json.
  forbidden_expressions:
    enabled: true
    fail_on_found: true
    expressions:
      - "é fundamental que"
      - "não é segredo que"
      - "o futuro é agora"
      - "vamos explorar"
      - "como sabemos"
      - "diante desse cenário"
      - "vale a pena destacar"
      - "grosso modo"
      - "vamos aprender"
      - "agora você vai entender"
      - "como todos sabem"
      - "desde os primórdios"
      - "desde tempos imemoriais"
      - "marco importante"
      - "papel crucial"
      - "momento decisivo"
      - "no cenário atual"
      - "em um contexto em constante evolução"
      - "solução inovadora"
      - "experiência fluida"
      - "abordagem poderosa"
      - "ambiente dinâmico"
      - "análises sugerem"
      - "é importante observar"
      - "não se trata apenas de"
      - "a verdadeira questão é"
      - "no fim, tudo se resume a"
      - "o futuro é promissor"
      - "abre caminho para novas possibilidades"
      - "representa um passo importante"
      - "atua como"
      - "se posiciona como"
      - "cumpre o papel de"
      - "descubra o poder"
      - "saiba mais"

  # Abertura direta e sem distração (R1 a R9, 08/09/2026). LIDA EM RUNTIME por
  # src/validators/abertura_checker.py, chamado por content_checker.check_content
  # (categoria "abertura", erro bloqueante) e por TsxGenerator.render_page
  # (AberturaError antes de escrever o arquivo). Pedido do dono: o topo carregado
  # dispersa o leitor e o card no meio compete com a leitura.
  #   R1 H1 > subtítulo (uma frase) > parágrafo; nada entre eles
  #   R3 sem percursos alternativos       R5 sem "mockup no seu negócio"
  #   R6 sem exercício "faça agora"       R7 fontes só no rodapé, curtas
  #   R8 sem card "checkpoint"            R9 sem "requer verificação" nem LGPD
  # `termos` ACRESCENTA padrões aos padrões do código (nunca remove). Cada item
  # é texto literal; prefixe com "re:" para passar uma expressão regular.
  abertura:
    enabled: true
    termos:
      R3: []
      R5_qualquer: []
      R5_rotulo: []
      R6: []
      R8: []
      R9: []

  # Anti-invenção (Humanizador 2.6.2) — humanizar não é inventar
  anti_invencao:
    enabled: true
    allow_marker: "[FALTA EVIDÊNCIA:"  # Redator pode marcar lacunas para o revisor
    # LIDO EM RUNTIME — content_checker.py::check_content (erro bloqueante).
    # Também conta "[PREENCHER-HUMANO:". Default no código: 5.
    fail_if_unresolved_markers_above: 5  # Mais que 5 marcadores sobrando = reprovar
    ban_vague_attribution: true  # "especialistas apontam" sem citação = erro
    # LIDO EM RUNTIME — content_checker.py::_check_percentages_have_source
    # (aviso não-bloqueante, teto de 5 por documento). Default no código: true.
    require_source_for_percentages: true  # Todo "%" deve ter fonte próxima

  # Camada 2c: Didática das superfícies que a régua de forma não mede
  # (22/09/2026, docs/ESPECIFICACAO_DIDATICA_20260922.md). LIDA EM RUNTIME por
  # src/validators/didatica_checker.py. A auditoria do curso de frontends e dos
  # portais mediu cinco defeitos invisíveis para o gate: ficha de recurso em
  # registro impessoal (sem "você", API crua, "Confira" em série, conferência
  # que manda "consultar a documentação"), paredão de fichas sem frase de
  # ligação, capítulo colado sem passagem e fecho que resume, subtítulo com a
  # fórmula "Você sai" e quatro promessas em corrente de vírgulas, título de
  # aula que é índice de técnico, e parágrafos vizinhos abrindo com a mesma
  # palavra. Quase tudo é aviso: didática se julga lendo. Erro só o tique
  # comprovado (série de 3 parágrafos iguais, fórmula em 3 subtítulos,
  # conferência de fuga). Mudar um número aqui muda o veredito no próximo run.
  didatica:
    enabled: true
    aberturas:
      # Pares de parágrafos vizinhos com a mesma primeira palavra: aviso a
      # partir deste tanto; série de N seguidos é erro.
      pares_iguais_aviso: 2
      serie_igual_erro: 3
      # Fração de parágrafos que abrem com artigo definido (O, A, Os, As)
      # acima da qual a cadência é de máquina. Só mede a partir do mínimo.
      artigo_definido_max_fracao: 0.5
      minimo_de_paragrafos: 6
    glosa:
      # A janela vem de lexicos.json (limiares.glosaJanelaCaracteres); este é
      # o fallback. termos_extra soma ao `jargao` da fonte, que é a lista.
      janela_caracteres: 140
      termos_extra: []
      max_achados: 8
    fecho:
      # O último parágrafo manda fazer (imperativo) e diz como conferir
      # (número, prazo, condição).
      exigir_acao: true
      exigir_criterio: true
    versoes:
      # Números de versão por mil palavras acima disto é enxurrada de versão
      # que não decide nada.
      por_mil_palavras_aviso: 4
    titulo:
      # Teto vem de lexicos.json (limiares.h1MaxPalavras); fallback aqui.
      # Dois-pontos e ausência de verbo avisam: título é promessa, não índice.
      max_palavras: 12
    subtitulo:
      max_palavras: 25
      virgulas_max: 2
      formulas:
        - "Você sai"
        - "Você vai sair"
        - "Você descobre"
        - "Você aprende"
        - "Você vai aprender"
        - "Você entende"
        - "Nesta aula"
        - "Neste módulo"
      # A mesma dupla de palavras abrindo este tanto de subtítulos do curso: erro.
      formula_repetida_erro: 3
    fichas:
      # "você" por mil palavras abaixo disto é registro de ficha técnica.
      voce_por_mil_min: 5
      # Mais fichas que isto abrindo o mesmo campo com a mesma palavra: aviso.
      abertura_repetida_max: 2
      # Fichas seguidas sem frase de ligação acima disto: paredão por acúmulo.
      seguidas_max: 6
      # Conferência que se protege em vez de ensinar: erro.
      fuga:
        - "versão instalada"
        - "documentação atual"
        - "documentação oficial"
        - "pode conter"
        - "consulte a documentação"
        - "verifique na documentação"
        - "posteriores ao recorte"
        - "podem ter mudado"

  # Camada 2d: Palavras de uso exagerado (pedido do dono, 27/09/2026). LIDA EM
  # RUNTIME por src/validators/vocabulario_checker.py, chamado por
  # content_checker.check_content (categoria "vocabulario"). Quatro palavras que
  # o time usa entre si soam estranhas ao leitor quando se repetem. Limite por
  # aula, em toda superfície de leitura, e só no sentido literal. Excesso é o
  # número de ocorrências além do limite: a partir de `excesso_para_aviso` sai
  # aviso; a partir de `excesso_para_erro`, erro. Código, nome de arquivo,
  # chave de configuração, destino de link e menção entre aspas ficam fora.
  # `instrucao_prompt` entra em draft.md e review.md (pt-br e raiz) pela
  # variável {bloco_vocabulario}; `{limite}` e `{familias}` são trocados pelos
  # valores abaixo. Sem esta seção, nada é cobrado nem instruído.
  palavras_de_uso_exagerado:
    enabled: true
    limite_por_aula: 1
    excesso_para_aviso: 1
    excesso_para_erro: 3
    familias:
      travar:
        rotulo: "travar (trava, travado, travando)"
        formas: [travar, trava, travas, travado, travada, travados, travadas, travando,
                 travou, travaram, travam, travamento, travamentos]
        trocas: [parar, emperrar, empacar, ficar preso, interromper, bloquear, impedir,
                 congelar, fixar]
      canonico:
        rotulo: "canônico (canônica, canônicos)"
        formas: [canônico, canônica, canônicos, canônicas, canonicamente,
                 canonico, canonica, canonicos, canonicas]
        trocas: [oficial, principal, de referência, padrão, adotado, definitivo, fonte única]
      regua:
        rotulo: "régua"
        formas: [régua, réguas, regua, reguas]
        trocas: [critério, padrão, medida, parâmetro, regra, norma, referencial, limite,
                 guia de escrita]
      honesto:
        rotulo: "honesto (honesta, honestamente, com honestidade)"
        formas: [honesto, honesta, honestos, honestas, honestamente, honestidade]
        trocas: [franco, direto, claro, realista, preciso, fiel aos fatos, sem exagero,
                 transparente]
    instrucao_prompt: |
      Quatro palavras soam estranhas ao leitor quando se repetem. Use no máximo {limite}
      ocorrência de cada família abaixo por aula, em qualquer superfície (título, subtítulo,
      prosa, legenda, célula de tabela), e só no sentido literal. Quase sempre a palavra sai e
      a frase afirma o fato; quando precisar de outra, troque pelo sentido:
      {familias}

  # Camada 2e: A aula não narra a própria apuração (pedido do dono, 27/09/2026).
  # ESTENDE o bastidor que já existe: content_checker._check_bastidor soma estes
  # padrões às famílias `bastidorDeVerificacao`, `rotuloDeConfianca` e
  # `metalinguagemDeProcesso` do espelho config/lexicos.json e ao
  # `metalinguagemRx` da fonte. Mesma severidade (erro, categoria editorial) e
  # mesma exceção: menção entre aspas não conta. A R9 do abertura_checker
  # continua cuidando do MARCADOR visível ("requer verificação", "fonte
  # pendente"); aqui mora a FRASE que conta ao leitor o que o redator checou.
  # Cada item é texto literal; prefixe com "re:" para expressão regular. Os
  # literais entram também como exemplos na instrução dos prompts
  # ({bloco_apuracao} em draft.md e review.md, pt-br e raiz).
  apuracao_narrada:
    enabled: true
    padroes:
      - "confirmado na fonte primária"
      - "confirmada na fonte primária"
      - "verificamos"
      - "conferido em"
      - "conferida em"
      - "não há fonte para"
      - "descartamos por falta de certeza"
      - "segundo o que apuramos"
      - "re:\\bn[ãa]o (?:foi|é|seria) poss[íi]vel (?:confirmar|verificar|checar|conferir)\\b"
      - "re:\\bn[ãa]o p[ôo]de ser (?:checad|verificad|confirmad|conferid)[oa]s?\\b"
      - "re:\\bconfirmad[oa]s? (?:na|em) fonte\\b"
      - "re:\\bverificou-se\\b"
    instrucao_prompt: |
      A aula não conta ao leitor como a informação foi checada. Ficam fora do texto frases
      como {exemplos}. A checagem decide o que entra; o leitor recebe só o resultado, e a
      fonte vai para o bloco de fontes do rodapé da trilha. Quando o assunto é disputado, a
      aula ensina a avaliar (quem mediu, em que prova, contra quem), como conteúdo.

  # Camada 2f: Crosslinks por aula (pedido do dono, 27/09/2026). OPT-IN POR
  # CLIENTE: piso, teto, prefixos e catálogo vivem no bloco `crosslinks` do
  # client.yaml (ClientContext.crosslinks); aqui mora só a forma, que vale
  # para todo cliente que ligar. LIDA EM RUNTIME por
  # src/validators/crosslink_checker.py (categoria "crosslinks").
  #   - ancoras_genericas: texto de link que não diz o que o leitor encontra
  #     lá. Âncora igual a um destes itens (sem pontuação, sem caixa) é erro.
  #   - paragrafos_iniciais_sem_link: nenhum crosslink nos N primeiros
  #     parágrafos da aula (R2: nada compete com a abertura); aviso.
  #   - max_destinos_no_prompt: quantos destinos do catálogo, os de maior
  #     afinidade de tag com o curso, entram na instrução do redator.
  #   - instrucao_prompt: texto de {bloco_crosslinks} em draft.md (pt-br e
  #     raiz); {min}, {max}, {destinos} e {anteriores} são trocados em runtime.
  crosslinks:
    ancoras_genericas:
      - "clique aqui"
      - "saiba mais"
      - "aqui"
      - "neste link"
      - "este link"
      - "link"
      - "veja também"
      - "leia também"
      - "leia mais"
      - "veja mais"
    paragrafos_iniciais_sem_link: 3
    max_destinos_no_prompt: 25
    instrucao_prompt: |
      Ligue esta aula a outros cursos do portal que completam o que ela ensina: de {min} a {max}
      cursos diferentes, só da lista abaixo, com o caminho exatamente como está nela. O link
      entra na prosa, no ponto em que o assunto aparece (nunca nos três primeiros parágrafos),
      e uma passagem no fecho diz onde aprofundar, depois da ponte para a próxima aula. Cite o
      curso pelo nome entre aspas e diga o que o leitor encontra lá que esta aula não ensina.
      O texto do link descreve o destino: nada de "clique aqui", "saiba mais" ou "neste link".
      Nunca card, botão, lista "veja também" nem "escolha seu caminho"; link interno sem UTM.
      {anteriores}
      Destinos disponíveis (caminho: nome):
      {destinos}

  # Camada 2g: Peso visual por aula declarado (27/09/2026). O cliente
  # (client.yaml, bloco `visual`) ou o curso (config/courses.yaml, chave
  # `visual`) podem sobrepor o teto padrão do espelho (tetos.D.figuras_max)
  # com min_por_aula, max_por_aula, min_tipos_por_aula e
  # max_paragrafos_sem_peca; o curso vence o cliente campo a campo. Medido por
  # src/validators/peso_visual_aula.py (categoria "peso visual"). Sem bloco
  # declarado, vale o teto do espelho, como antes. Aqui mora só o texto da
  # instrução que entra em draft.md ({bloco_peso_visual}, pt-br e raiz);
  # {min}, {max}, {tipos} e {paragrafos} são trocados pelos valores declarados.
  peso_visual:
    instrucao_prompt: |
      Neste curso a regra de apoio visual muda: cada aula leva de {min} a {max} peças visuais,
      de pelo menos {tipos} tipos diferentes, e nenhuma sequência de mais de {paragrafos}
      parágrafos sem uma peça. A primeira peça vem logo depois dos parágrafos de abertura,
      nunca antes deles. Cada peça carrega informação própria: substitui ou completa o texto,
      nunca repete o parágrafo de cima, e a legenda afirma um fato. Do Markdown saem três
      tipos: tabela (comparação com critérios), lista numerada de passos (processo em que a
      ordem importa) e imagem com legenda (conceito que pede figura).

  # Camada 2h: Tamanho e ordem do curso, pelos dados de uso do portal
  # (27/09/2026). Curso curto termina e curso longo não; o aluno abandona na
  # teoria que chega cedo, no capítulo de contexto com número de terceiros e
  # no apêndice de instalação; a rolagem média dos capítulos abandonados fica
  # abaixo de 60%. LIDA EM RUNTIME por src/validators/planejamento_checker.py:
  #   - instrucao_plano: entra no prompt de planejamento de aulas
  #     (Orchestrator._plan_lessons), com {aulas_min}, {aulas_max},
  #     {iniciais} e {modulo} trocados em runtime;
  #   - instrucao_aula / instrucao_aula_inicial: entram no draft.md
  #     ({bloco_ordem_do_curso}); a segunda só nas `aulas_iniciais_curtas`
  #     primeiras aulas do curso, com {palavras_max};
  #   - aviso (nunca erro) quando o curso sai da faixa `aulas_por_curso` ou
  #     quando uma das primeiras aulas passa de `palavras_max_aulas_iniciais`
  #     (QualityGate.check_curso, entrada "curso (sequência)").
  planejamento:
    enabled: true
    aulas_por_curso: [14, 18]
    aulas_iniciais_curtas: 3
    palavras_max_aulas_iniciais: 900
    instrucao_plano: |
      Tamanho e ordem, pelos dados de uso do portal: curso curto termina, curso longo não, e o
      aluno abandona na teoria que chega cedo e no apêndice de instalação. Para tema amplo, o
      curso inteiro fica entre {aulas_min} e {aulas_max} aulas; aula que não muda uma decisão
      do aluno sai. As {iniciais} primeiras aulas do curso são as mais curtas e as mais
      práticas, com um ganho no primeiro dia. Teoria densa só da metade do curso em diante, e
      sempre depois de um caso contado inteiro. Nenhuma aula é apêndice de instalação: o passo
      de instalação entra como passo a passo curto dentro da aula que precisa dele. Este é o
      módulo {modulo} do curso.
    instrucao_aula: |
      A tese da aula e o que o aluno faz com ela ficam na primeira metade do texto, porque a
      maior parte dos leitores não chega ao fim da página. O fecho retoma o caso e dá o
      critério de acerto; ele não guarda a informação principal.
    instrucao_aula_inicial: |
      Esta é uma das primeiras aulas do curso, que precisam ser as mais curtas e as mais
      práticas: no máximo {palavras_max} palavras, com um ganho que o aluno aplica no mesmo
      dia, sem panorama histórico, sem taxonomia e sem teoria densa.

  # Camada 2i: Tabela de proveniência (27/09/2026). Arquivo de trabalho, nunca
  # página: lista as frases da aula com número, data, versão ou nome de
  # produto, para quem confere preencher URL primária, trecho lido e data de
  # acesso. LIDA EM RUNTIME por src/validators/proveniencia.py, chamado pelo
  # orquestrador ao fim do pipeline (result.etapas["proveniencia"]) e por
  # `python cli.py proveniencia <arquivo>`. O formato de retorno do redator e
  # do revisor não muda. `padroes` são expressões regulares por tipo;
  # `rotulos_de_exemplo` marcam a frase de exemplo, que dispensa fonte.
  proveniencia:
    enabled: true
    padroes:
      numero: "\\d"
      data: "(?i)\\b(?:janeiro|fevereiro|março|abril|maio|junho|julho|agosto|setembro|outubro|novembro|dezembro)\\b|\\b\\d{1,2}/\\d{1,2}(?:/\\d{2,4})?\\b|\\b(?:19|20)\\d{2}\\b"
      versao: "(?i)\\bv\\d+(?:\\.\\d+)*\\b|(?<!R\\$ )\\b(?!\\d{1,3}(?:\\.\\d{3})+\\b)\\d+\\.\\d+(?:\\.\\d+)?\\b(?!\\s*%)|\\bvers[ãa]o\\s+\\d+"
      produto: "\\b[A-Z][a-z]+[A-Z][A-Za-z]+\\b|\\b[A-Z][A-Za-z]*[- ]\\d+(?:\\.\\d+)*\\b|\\b[A-Z]{1,4}\\d{1,3}\\b"
    rotulos_de_exemplo:
      - "suponha"
      - "imagine"
      - "por exemplo, um"
      - "digamos que"
      - "número de exemplo"

  # Camada 3: Links
  link_check:
    enabled: true
    check_internal: true
    check_external: false
    fail_on_broken: true
    url_must_not_contain_accents: true  # Crítico — incidente 2026-03-27

  # Camada 4: HTML
  html_validation:
    enabled: true
    check_closing_tags: true
    check_valid_attributes: true
    check_accessibility: true
    required_elements:
      - meta[charset]
      - title
      - main
      - h1

  # Camada 5: FinOps
  finops:
    budget_guard_enabled: true
    alert_at_percent: 80
    block_at_percent: 100
    cost_report_after_each_course: true
    max_claude_per_course_usd: 5.00
    max_total_per_course_usd: 10.00

  # Proibições globais
  global_prohibitions:
    emojis: true
    superlativos_sem_evidencia: true
    credenciais_inventadas: true

  # Anti-retrabalho
  anti_retrabalho:
    atomic_generation: true
    no_heredocs_over_50_lines: true
    no_regex_substitution: true
    validate_before_deploy: true
    cache_approved_content: true
    prompts_in_external_files: true  # src/templates/prompts/*.md
